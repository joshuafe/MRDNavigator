<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MRD Navigator — Bedside Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-canvas: #FAF6EE;
    --card-bg: #FFFFFF;
    --ink-black: #1E1B18;
    --ink-muted: #6B655F;
    
    /* Quirky, high-contrast pop palette */
    --pop-yellow: #FFDE59;
    --pop-pink: #FF66C4;
    --pop-blue: #5271FF;
    --pop-green: #00BF63;
    --pop-orange: #FF914D;
    --pop-purple: #8C52FF;
    --pop-red: #FF5757;

    --border-thick: 3px solid #1E1B18;
    --shadow-push: 0px 6px 0px #1E1B18;
    --shadow-push-small: 0px 4px 0px #1E1B18;
    --shadow-active: 0px 0px 0px #1E1B18;

    --font-head: 'Fredoka', sans-serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-canvas); color: var(--ink-black); font-family: var(--font-body); }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    /* Playful graph-paper grid background pattern */
    background-image: radial-gradient(#1e1b18 0.75px, transparent 0.75px);
    background-size: 16px 16px;
    background-color: var(--bg-canvas);
  }

  /* Physical App Shell Container */
  .app-shell {
    width: 100%;
    max-width: 440px;
    height: min(890px, 96vh);
    background: #FFFDF9;
    border: var(--border-thick);
    border-radius: 32px;
    box-shadow: 8px 12px 0px #1E1B18;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  @media (max-width: 480px) {
    body { padding: 0; background: #FFFDF9; }
    .app-shell { height: 100vh; max-width: none; border-radius: 0; border: none; box-shadow: none; }
  }

  /* Header Bar */
  .app-header {
    padding: 18px 20px 12px;
    background: var(--pop-yellow);
    border-bottom: var(--border-thick);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand-badge {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-badge .icon-sticker {
    background: var(--pop-pink);
    border: 2px solid var(--ink-black);
    width: 32px;
    height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 2px 2px 0px var(--ink-black);
  }

  .btn-retro {
    font-family: var(--font-head);
    font-size: 14px;
    font-weight: 700;
    background: #FFFFFF;
    color: var(--ink-black);
    border: 2px solid var(--ink-black);
    padding: 6px 12px;
    border-radius: 12px;
    box-shadow: var(--shadow-push-small);
    cursor: pointer;
    transition: all 0.08s ease;
  }
  .btn-retro:active {
    transform: translateY(4px);
    box-shadow: var(--shadow-active);
  }

  /* Navigation Crumb Ribbon */
  .crumb-ribbon {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: #F4EFE6;
    border-bottom: 2px solid var(--ink-black);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .crumb-ribbon::-webkit-scrollbar { display: none; }
  
  .crumb-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 800;
    background: #FFF;
    border: 2px solid var(--ink-black);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 2px 2px 0px var(--ink-black);
  }

  /* Scrollable Workspace Area */
  .app-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 28px;
    display: flex;
    flex-direction: column;
  }

  /* Chunky Step Progress Bar */
  .step-tracker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .step-node {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--ink-black);
    background: #FFF;
    font-family: var(--font-mono);
    font-weight: 800;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 2px 2px 0px var(--ink-black);
  }
  .step-node.active {
    background: var(--pop-orange);
    color: #FFF;
    transform: scale(1.15);
  }
  .step-node.done {
    background: var(--pop-green);
    color: #FFF;
  }

  /* Screen Title & Prompting */
  .question-title {
    font-family: var(--font-head);
    font-size: 28px;
    line-height: 1.15;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: var(--ink-black);
  }
  .question-subtitle {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 22px;
    line-height: 1.4;
  }

  /* Massive Pressable Option Cards */
  .option-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn-option {
    background: var(--card-bg);
    border: var(--border-thick);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-push);
    cursor: pointer;
    text-align: left;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.1s;
    width: 100%;
    position: relative;
  }

  .btn-option:active, .btn-option.selected {
    transform: translateY(6px);
    box-shadow: var(--shadow-active);
  }

  .btn-option.selected {
    background: #FFF9E6;
    border-color: var(--ink-black);
  }

  .option-badge {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    border: 2.5px solid var(--ink-black);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    color: #FFF;
    box-shadow: 2px 2px 0px var(--ink-black);
    flex-shrink: 0;
  }

  .option-content {
    flex: 1;
  }

  .option-title {
    font-family: var(--font-head);
    font-size: 19px;
    font-weight: 700;
    color: var(--ink-black);
    display: block;
    line-height: 1.2;
  }

  .option-desc {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 4px;
    display: block;
    line-height: 1.35;
  }

  /* Bedside Warning "Sticky Notes" */
  .sticky-note {
    background: #FFF066;
    border: var(--border-thick);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 4px 4px 0px var(--ink-black);
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .sticky-note.red { background: #FF9999; }
  .sticky-note.blue { background: #99B3FF; }
  .sticky-note.green { background: #80E6B3; }

  .sticky-icon {
    font-size: 22px;
    line-height: 1;
  }
  .sticky-text {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink-black);
  }

  /* Physical "Specimen Tube" Test Cards */
  .tube-card {
    background: #FFFFFF;
    border: var(--border-thick);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-push-small);
    position: relative;
  }

  .tube-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .tube-number {
    width: 32px;
    height: 32px;
    background: var(--ink-black);
    color: #FFF;
    border-radius: 10px;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .tube-title-area { flex: 1; }
  .tube-title {
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
  }
  .tube-why {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-top: 4px;
    line-height: 1.35;
  }

  .tag-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    border: 1.5px solid var(--ink-black);
    text-transform: uppercase;
    display: inline-block;
  }
  .tag-pill.in-house { background: var(--pop-green); color: #FFF; }
  .tag-pill.send-out { background: var(--pop-orange); color: #FFF; }
  .tag-pill.arup { background: var(--pop-pink); color: #FFF; }

  .tube-meta {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 2px dashed #E5DFD5;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    font-size: 12px;
  }
  .meta-key { font-family: var(--font-mono); font-weight: 800; color: var(--ink-muted); text-transform: uppercase; font-size: 10px; }
  .meta-val { font-weight: 700; color: var(--ink-black); }

  /* Physical Bottom Tab Bar */
  .bottom-nav {
    background: #FFF;
    border-top: var(--border-thick);
    display: flex;
    padding: 6px 12px max(8px, env(safe-area-inset-bottom));
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 0;
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-muted);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .tab-btn.active {
    color: var(--ink-black);
  }
  .tab-btn .tab-indicator {
    width: 24px;
    height: 4px;
    background: transparent;
    border-radius: 4px;
  }
  .tab-btn.active .tab-indicator {
    background: var(--pop-pink);
  }

  /* Micro animations */
  .pop-in { animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.95) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Expandable Accordions */
  .quirky-accordion {
    background: #FFF;
    border: var(--border-thick);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-push-small);
  }
  .quirky-accordion summary {
    padding: 14px 16px;
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FFFDF9;
  }
  .quirky-accordion summary::-webkit-details-marker { display: none; }
  .quirky-accordion[open] summary { border-bottom: 2px solid var(--ink-black); background: var(--pop-yellow); }
  .quirky-content { padding: 14px 16px; }

  /* Interpretation Tables */
  .pop-table {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 12px;
  }
  .pop-table th {
    background: #1E1B18;
    color: #FFF;
    font-family: var(--font-mono);
    padding: 6px 8px;
    text-align: left;
    font-size: 10px;
  }
  .pop-table td {
    padding: 8px;
    border-bottom: 1px solid #E5DFD5;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Header -->
  <header class="app-header">
    <div class="brand-badge">
      <span class="icon-sticker">🧪</span>
      <span>MRD Navigator</span>
    </div>
    <button class="btn-retro" id="btnBack" style="display:none;" onclick="goBack()">← Back</button>
    <button class="btn-retro" id="btnReset" style="display:none;" onclick="restart()">Reset</button>
  </header>

  <!-- Navigation Ribbon -->
  <div class="crumb-ribbon" id="crumbRibbon" style="display:none;"></div>

  <!-- Main Interactive Body -->
  <main class="app-body" id="appBody"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="tab-btn active" id="tabDecide" onclick="setTab('decide')">
      <span style="font-size:18px">🎯</span>
      <span>Decide</span>
      <div class="tab-indicator"></div>
    </button>
    <button class="tab-btn" id="tabRef" onclick="setTab('ref')">
      <span style="font-size:18px">📚</span>
      <span>Reference</span>
      <div class="tab-indicator"></div>
    </button>
  </nav>
</div>

<script>
/* Embedded Data Definitions */
const T = {
  morph:   {nm:'Morphology + Biopsy', badge:'in-house', src:'bm', emr:'Heme Comprehensive', tube:'—', vol:'—', sens:'', wy:'Aspirate + core review — required on every marrow.'},
  flow:    {nm:'Flow Cytometry (MFC)', badge:'in-house', src:'bm', emr:'Heme Comprehensive / Flow Only', tube:'Sodium Heparin', vol:'BM 1 tube', sens:'', wy:'Immunophenotyping / MFC MRD. Requires fresh viable cells.'},
  cyto:    {nm:'Cytogenetics + FISH', badge:'in-house', src:'bm', emr:'Heme Comprehensive / Cytogenetics', tube:'Sodium Heparin', vol:'BM 1 tube', sens:'', wy:'Karyotype + disease FISH panel.'},
  chim_w:  {nm:'Chimerism — Whole (Unsorted)', badge:'in-house', src:'both', emr:'Chimerism', tube:'EDTA', vol:'—', sens:'', wy:'Donor/recipient balance — marrow or blood.'},
  chim_l:  {nm:'Chimerism — CD3 + CD33 (Lineage)', badge:'in-house', src:'pb', emr:'Chimerism Lineage', tube:'EDTA', vol:'—', sens:'', wy:'Lineage-sorted from peripheral blood.'},
  npm1_pcr:{nm:'NPM1 Type A — RT-PCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'0.01% NCN', wy:'Quantitative trend-based AML tracking.'},
  npm1_ngs:{nm:'NPM1 UHS-NGS (Invivoscribe)', badge:'send-out', src:'bm', emr:'Sendout — NPM1 MRD', tube:'EDTA', vol:'PB 1-3mL / BM 0.25-1mL', sens:'', wy:'LeukoStrat NGS — covers ALL exon 12 mutations.'},
  flt3_pcr:{nm:'FLT3 ITD/TKD Rapid PCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'Diagnostic Grade', wy:'Diagnostic use only — NOT an MRD test.'},
  flt3_ngs:{nm:'FLT3-ITD UHS-NGS (Invivoscribe)', badge:'send-out', src:'bm', emr:'Sendout — FLT3 ITD MRD', tube:'EDTA', vol:'BM 0.25-1mL', sens:'10⁻⁴–10⁻⁵ VAF', wy:'MRD grade. Marrow required (blood is less sensitive).'},
  idh:     {nm:'IDH1 / IDH2 ddPCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'0.1% FA', wy:'IDH1/2 mutant allele burden.'},
  cbfb:    {nm:'CBFB::MYH11 RT-PCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'0.004% NCN', wy:'inv(16) CBF-AML transcript monitoring.'},
  runx1:   {nm:'RUNX1::RUNX1T1 RT-PCR', badge:'arup', src:'bm', emr:'Sendout — ARUP', tube:'EDTA', vol:'', sens:'', wy:'t(8;21) CBF-AML transcript (ARUP send-out).'},
  pml:     {nm:'PML-RARA PCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'1/10³–1/10⁴', wy:'APL t(15;17) transcript.'},
  bcrabl:  {nm:'BCR-ABL1 PCR (p210 / p190)', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'0.001% IS', wy:'Ph+ disease quantitative tracking.'},
  jak2:    {nm:'JAK2 V617F ddPCR', badge:'in-house', src:'bm', emr:'Heme Molecular', tube:'EDTA (2 tubes)', vol:'', sens:'0.1% FA', wy:'JAK2 allele burden.'},
  calrmpl: {nm:'CALR / MPL Driver', badge:'send-out', src:'bm', emr:'Sendout — NeoGenomics', tube:'EDTA', vol:'', sens:'', wy:'Patient driver when JAK2 is negative.'},
  cseq_id: {nm:'ClonoSEQ ID (Adaptive)', badge:'send-out', src:'bm', emr:'Adaptive Clonoseq ID', tube:'EDTA', vol:'PB >2mL / BM >200µL', sens:'', wy:'Establishes trackable clone. Required at diagnosis.'},
  cseq_mrd:{nm:'ClonoSEQ MRD (Adaptive)', badge:'send-out', src:'bm', emr:'Adaptive Clonoseq MRD', tube:'EDTA', vol:'BM ≥1mL', sens:'~10⁻⁶', wy:'Ultra-sensitive lymphoid MRD.'},
  neocomp: {nm:'NeoComp Myeloid NGS', badge:'send-out', src:'bm', emr:'Sendout — NeoGenomics', tube:'EDTA', vol:'BM 2-3mL', sens:'', wy:'Tracks broad mutations without dedicated PCR.'},
  rna:     {nm:'RNA Fusion Panel (Archer)', badge:'in-house', src:'bm', emr:'Heme Comprehensive', tube:'EDTA', vol:'', sens:'0.5%', wy:'Rare fusion tracking (e.g. KMT2A).'},
  biobank: {nm:'Research Biobank Pull', badge:'in-house', src:'bm', emr:'Research Pull', tube:'0.5mL Heparin Syringe', vol:'5 mL', sens:'', wy:'Drawn LAST. Questions → Joshua Fein / Edgar Rey.'}
};

const DIS = {
  aml:{label:'AML / MDS', color:'var(--pop-red)', ic:'🧬', sub:'Acute Myeloid / MDS'},
  all:{label:'ALL', color:'var(--pop-purple)', ic:'🔬', sub:'Acute Lymphoblastic (B & T)'},
  cml:{label:'CML', color:'var(--pop-orange)', ic:'🩸', sub:'Chronic Myeloid Leukemia'},
  mpn:{label:'MF / MPN', color:'var(--pop-blue)', ic:'🧪', sub:'Myelofibrosis / MPN'}
};

const SETTING = {
  newdx:  {label:'New Diagnosis', ic:'✚', color:'var(--pop-red)', sub:'First time evaluation', burden:'high'},
  relapse:{label:'Suspected Relapse', ic:'⚠️', color:'var(--pop-orange)', sub:'New cytopenias / falling donor cells', burden:'high'},
  followup:{label:'Follow-Up / Response', ic:'🎯', color:'var(--pop-purple)', sub:'Pre-HCT or post-induction CR', burden:'low'},
  posthct:{label:'Post-Transplant', ic:'⭐', color:'var(--pop-green)', sub:'Routine surveillance post-HCT', burden:'low'}
};

let state = {};
let step = 0;
let currentTab = 'decide';

const appBody = document.getElementById('appBody');
const btnBack = document.getElementById('btnBack');
const btnReset = document.getElementById('btnReset');
const crumbRibbon = document.getElementById('crumbRibbon');

function buildQueue(s) {
  const q = ['disease','setting'];
  if(!s.disease || !s.setting) return q;

  if(s.setting === 'followup') q.push('fu_stage');
  if(s.setting === 'posthct') q.push('ph_day');

  const lowBurden = (s.setting==='followup' || s.setting==='posthct');
  if(lowBurden) {
    if(s.disease==='aml') q.push('npm1','flt3','cbf','othermut','fusion');
    if(s.disease==='all') q.push('lineage','clone','ph','all_fusion');
    if(s.disease==='mpn') q.push('driver');
  }
  q.push('biobank');
  return q;
}

function questionDef(id, s) {
  switch(id) {
    case 'disease': return { q:'Step 1: Disease', sub:'Which condition are we evaluating today?', opts:[
      {v:'aml', l:'AML / MDS', s:DIS.aml.sub, ic:'🧬', c:DIS.aml.color},
      {v:'all', l:'ALL', s:DIS.all.sub, ic:'🔬', c:DIS.all.color},
      {v:'cml', l:'CML', s:DIS.cml.sub, ic:'🩸', c:DIS.cml.color},
      {v:'mpn', l:'MF / MPN', s:DIS.mpn.sub, ic:'🧪', c:DIS.mpn.color}
    ]};
    case 'setting': return { q:'Step 2: Context', sub:'What is the clinical setting for this draw?', opts:[
      {v:'newdx', l:'New Diagnosis', s:SETTING.newdx.sub, ic:'✚', c:SETTING.newdx.color},
      {v:'relapse', l:'Suspected Relapse', s:SETTING.relapse.sub, ic:'⚠️', c:SETTING.relapse.color},
      {v:'followup', l:'Follow-Up / Response', s:SETTING.followup.sub, ic:'🎯', c:SETTING.followup.color},
      {v:'posthct', l:'Post-Transplant', s:SETTING.posthct.sub, ic:'⭐', c:SETTING.posthct.color}
    ]};
    case 'fu_stage': return { q:'Which Follow-Up Stage?', sub:'Select the current evaluation point:', opts:[
      {v:'firstcr', l:'First CR (Post-Induction)', s:'NeoComp NGS required', ic:'1️⃣', c:'var(--pop-purple)'},
      {v:'prehct', l:'Pre-Transplant Workup', s:'NPM1: Send BOTH assays', ic:'🛫', c:'var(--pop-blue)'},
      {v:'other', l:'Other Response Assessment', s:'Standard tracking', ic:'📊', c:'var(--pop-orange)'}
    ]};
    case 'ph_day': return { q:'Post-HCT Timepoint', sub:'Select the post-transplant landmark:', opts:[
      {v:'d30', l:'Day +30', s:'NPM1 both assays · NeoComp if mut at dx', ic:'3️⃣0️⃣', c:'var(--pop-green)'},
      {v:'d100', l:'Day +100', s:'Routine surveillance', ic:'1️⃣0️⃣0️⃣', c:'var(--pop-green)'},
      {v:'d180', l:'Day +180', s:'Surveillance', ic:'1️⃣8️⃣0️⃣', c:'var(--pop-green)'},
      {v:'d360', l:'Day +360', s:'1-Year post-HCT', ic:'🎂', c:'var(--pop-green)'},
      {v:'interim', l:'Interim Monitoring (Blood)', s:'Between marrow assessments', ic:'🩸', c:'var(--pop-blue)'}
    ]};
    case 'npm1': return { q:'NPM1 Status?', sub:'Type A uses in-house PCR; non-Type-A needs NGS.', opts:[
      {v:'none', l:'Negative / None', s:'', ic:'❌', c:'var(--ink-muted)'},
      {v:'typea', l:'Type A Mutation', s:'In-house RT-PCR', ic:'🅰️', c:'var(--pop-red)'},
      {v:'nona', l:'Non–Type-A Mutation', s:'Invivoscribe NGS Exon 12', ic:'🅱️', c:'var(--pop-orange)'}
    ]};
    case 'flt3': return { q:'FLT3 Status?', sub:'ITD has an MRD sendout; TKD is diagnostic only.', opts:[
      {v:'none', l:'Negative / None', s:'', ic:'❌', c:'var(--ink-muted)'},
      {v:'itd', l:'FLT3-ITD', s:'UHS-NGS MRD (Marrow mandatory)', ic:'⚡', c:'var(--pop-red)'},
      {v:'tkd', l:'FLT3-TKD Only', s:'No MRD assay (diagnostic PCR only)', ic:'🔍', c:'var(--pop-orange)'},
      {v:'both', l:'Both ITD + TKD', s:'', ic:'💥', c:'var(--pop-red)'}
    ]};
    case 'cbf': return { q:'Core-Binding-Factor Lesion?', sub:'', opts:[
      {v:'none', l:'None', s:'', ic:'❌', c:'var(--ink-muted)'},
      {v:'inv16', l:'inv(16)', s:'CBFB::MYH11 (In-house)', ic:'🧩', c:'var(--pop-purple)'},
      {v:'t821', l:'t(8;21)', s:'RUNX1::RUNX1T1 (ARUP send-out)', ic:'📦', c:'var(--pop-pink)'}
    ]};
    case 'othermut': return { q:'Other Diagnostic Mutations?', sub:'e.g. ASXL1, KMT2A, TP53 tracked by NeoComp NGS.', opts:[
      {v:'yes', l:'Yes — Track via NeoComp', s:'', ic:'✅', c:'var(--pop-purple)'},
      {v:'no', l:'No', s:'', ic:'❌', c:'var(--ink-muted)'}
    ]};
    case 'fusion': return { q:'Non-PCR Trackable Fusion?', sub:'e.g. KMT2A rearrangement or Ph-like ABL.', opts:[
      {v:'yes', l:'Yes — Add Archer RNA Panel', s:'', ic:'🧬', c:'var(--pop-blue)'},
      {v:'no', l:'No', s:'', ic:'❌', c:'var(--ink-muted)'}
    ]};
    case 'lineage': return { q:'ALL Lineage', sub:'B-ALL alters chimerism strategy.', opts:[
      {v:'b', l:'B-ALL', s:'Send sorted + unsorted chimerism', ic:'🅰️', c:'var(--pop-purple)'},
      {v:'t', l:'T-ALL', s:'Standard tracking', ic:'🅱️', c:'var(--pop-blue)'}
    ]};
    case 'clone': return { q:'ClonoSEQ Clone Established?', sub:'Baseline clone needed for ClonoSEQ MRD.', opts:[
      {v:'yes', l:'Yes — Clone on file', s:'Order ClonoSEQ MRD', ic:'🎯', c:'var(--pop-green)'},
      {v:'no', l:'No / Unknown', s:'Send ClonoSEQ ID first', ic:'🚨', c:'var(--pop-red)'}
    ]};
    case 'ph': return { q:'Ph+ Status (BCR-ABL)?', sub:'', opts:[
      {v:'no', l:'Negative', s:'', ic:'❌', c:'var(--ink-muted)'},
      {v:'p210', l:'Ph+ (p210)', s:'', ic:'🔬', c:'var(--pop-orange)'},
      {v:'p190', l:'Ph+ (p190)', s:'', ic:'🔬', c:'var(--pop-orange)'},
      {v:'yes', l:'Ph+ (Transcript Unknown)', s:'', ic:'❓', c:'var(--pop-orange)'}
    ]};
    case 'all_fusion': return { q:'Rare Fusion at Diagnosis?', sub:'', opts:[
      {v:'yes', l:'Yes — Send RNA Fusion', s:'', ic:'✅', c:'var(--pop-blue)'},
      {v:'no', l:'No', s:'', ic:'❌', c:'var(--ink-muted)'}
    ]};
    case 'driver': return { q:'MPN Driver Mutation?', sub:'', opts:[
      {v:'jak2', l:'JAK2 V617F', s:'In-house ddPCR', ic:'🎯', c:'var(--pop-blue)'},
      {v:'calr', l:'CALR', s:'NeoGenomics', ic:'📦', c:'var(--pop-blue)'},
      {v:'mpl', l:'MPL', s:'NeoGenomics', ic:'📦', c:'var(--pop-blue)'},
      {v:'tn', l:'Triple-Negative / Other', s:'Full NGS', ic:'🌐', c:'var(--ink-muted)'}
    ]};
    case 'biobank': return { q:'Research Biobank Sample?', sub:'Draw 5 mL into 0.5 mL heparin syringe LAST. Questions → Joshua Fein / Edgar Rey.', opts:[
      {v:'yes', l:'Eligible — Include Pull', s:'', ic:'🧪', c:'var(--pop-green)'},
      {v:'unsure', l:'Unsure — Include & Confirm', s:'', ic:'❓', c:'var(--pop-orange)'},
      {v:'no', l:'Not Eligible / Skip', s:'', ic:'🚫', c:'var(--ink-muted)'}
    ]};
  }
  return {q:id, opts:[]};
}

function answer(id, val) {
  state[id] = val;
  const queue = buildQueue(state);
  const idx = queue.indexOf(id);
  step = idx + 1;
  render();
}

function goBack() {
  if(step <= 0) return;
  step--;
  render();
}

function restart() {
  state = {};
  step = 0;
  render();
}

function setTab(t) {
  currentTab = t;
  document.getElementById('tabDecide').classList.toggle('active', t==='decide');
  document.getElementById('tabRef').classList.toggle('active', t==='ref');
  render();
}

function renderCrumbs() {
  const parts = [];
  if(state.disease) parts.push(`<span class="crumb-chip">DIS: ${DIS[state.disease].label}</span>`);
  if(state.setting) parts.push(`<span class="crumb-chip">CTX: ${SETTING[state.setting].label}</span>`);
  if(parts.length) {
    crumbRibbon.style.display = 'flex';
    crumbRibbon.innerHTML = parts.join('');
  } else {
    crumbRibbon.style.display = 'none';
  }
}

function render() {
  if(currentTab === 'ref') {
    renderRef();
    return;
  }

  const queue = buildQueue(state);
  const complete = queue.every(id => state[id] !== undefined);

  btnBack.style.display = (step > 0) ? 'inline-block' : 'none';
  btnReset.style.display = (step > 0) ? 'inline-block' : 'none';

  renderCrumbs();

  if(complete && step >= queue.length) {
    renderPlan();
    return;
  }

  renderQuestion(queue[step], queue);
}

function renderQuestion(id, queue) {
  const def = questionDef(id, state);
  
  const stepNodes = queue.map((qid, idx) => {
    let cls = idx < step ? 'done' : (idx === step ? 'active' : '');
    return `<div class="step-node ${cls}">${idx < step ? '✓' : idx + 1}</div>`;
  }).join('');

  const optionsHTML = def.opts.map(o => `
    <button class="btn-option pop-in" onclick="answer('${id}', '${o.v}')">
      <div class="option-badge" style="background:${o.c}">${o.ic}</div>
      <div class="option-content">
        <span class="option-title">${o.l}</span>
        ${o.s ? `<span class="option-desc">${o.s}</span>` : ''}
      </div>
    </button>
  `).join('');

  appBody.innerHTML = `
    <div class="step-tracker">${stepNodes}</div>
    <div class="question-title">${def.q}</div>
    <div class="question-subtitle">${def.sub}</div>
    <div class="option-stack">${optionsHTML}</div>
  `;
}

function assemblePlan(s) {
  const high = SETTING[s.setting].burden === 'high';
  const posthct = s.setting === 'posthct';
  const mrd = [], additional = [], flags = [], chim = [];

  const add = (bucket, key, why) => {
    const item = Object.assign({}, T[key]);
    if(why) item.wy = why;
    item.key = key;
    bucket.push(item);
  };

  if(high) {
    flags.push({c:'red', i:'⚠️', t:'<b>SUSPECTED RELAPSE / NEW DX:</b> Order high-volume diagnostic panel. Do not rely solely on surveillance MRD.'});
    flags.push({c:'blue', i:'📣', t:'<b>VERIFY OUT LOUD AT BEDSIDE:</b> Attending and APP must verbally cross-check tests and tube sequence.'});
    if(s.disease==='aml') {
      add(additional, 'rna'); add(additional, 'neocomp'); add(additional, 'flt3_pcr'); add(additional, 'idh'); add(additional, 'npm1_pcr');
    } else if(s.disease==='all') {
      add(mrd, 'cseq_id'); add(additional, 'rna'); add(additional, 'neocomp');
    }
  } else {
    flags.push({c:'red', i:'🩸', t:'<b>PREVIOUS FIRST PULL IS PRECIOUS:</b> First marrow aspirate is least diluted. Give it directly to the highest-sensitivity MRD assay!'});
    if(s.disease==='aml') {
      if(s.npm1==='typea') add(mrd, 'npm1_pcr');
      if(s.npm1==='nona') add(mrd, 'npm1_ngs');
      if(s.flt3==='itd'||s.flt3==='both') add(mrd, 'flt3_ngs');
      if(s.cbf==='inv16') add(mrd, 'cbfb');
      if(s.cbf==='t821') add(mrd, 'runx1');
      if(s.othermut==='yes') add(additional, 'neocomp');
    } else if(s.disease==='all') {
      if(s.clone==='yes') add(mrd, 'cseq_mrd'); else add(mrd, 'cseq_id');
      if(s.ph && s.ph!=='no') add(mrd, 'bcrabl');
    }
  }

  if(posthct) {
    add(chim, 'chim_w'); add(chim, 'chim_l');
  }

  let order = [];
  order.push(Object.assign({key:'morph'}, T.morph));
  mrd.forEach(t => order.push(t));
  order.push(Object.assign({key:'flow'}, T.flow));
  order.push(Object.assign({key:'cyto'}, T.cyto));
  additional.forEach(t => order.push(t));
  chim.forEach(t => order.push(t));

  if(s.biobank==='yes' || s.biobank==='unsure') {
    order.push(Object.assign({key:'biobank'}, T.biobank));
  }

  return {order, flags, high};
}

function renderPlan() {
  const p = assemblePlan(state);

  const flagsHTML = p.flags.map(f => `
    <div class="sticky-note ${f.c}">
      <span class="sticky-icon">${f.i}</span>
      <span class="sticky-text">${f.t}</span>
    </div>
  `).join('');

  const testsHTML = p.order.map((t, idx) => `
    <div class="tube-card pop-in">
      <div class="tube-header">
        <div class="tube-number">${idx === 0 ? '✓' : idx}</div>
        <div class="tube-title-area">
          <div class="tube-title">${t.nm}</div>
          <div class="tube-why">${t.wy}</div>
        </div>
        <span class="tag-pill ${t.badge}">${t.badge}</span>
      </div>
      <div class="tube-meta">
        <span class="meta-key">Tube / Vol</span><span class="meta-val">${t.tube} (${t.vol || 'Std'})</span>
        <span class="meta-key">EMR Order</span><span class="meta-val" style="font-family:var(--font-mono);">${t.emr}</span>
      </div>
    </div>
  `).join('');

  appBody.innerHTML = `
    <div class="question-title" style="color:var(--pop-purple)">Bedside Draw Plan</div>
    <div class="question-subtitle">Follow this sequence top-to-bottom for minimal dilution errors.</div>
    
    ${flagsHTML}

    <div style="font-family:var(--font-head); font-size:18px; font-weight:700; margin:16px 0 10px;">
      🧪 Order of Collection Vials
    </div>
    ${testsHTML}

    <details class="quirky-accordion">
      <summary><span>📈 Result Interpretation Rules</span> <span>▼</span></summary>
      <div class="quirky-content">
        <table class="pop-table">
          <tr><th>Response</th><th>Action Required</th></tr>
          <tr><td style="color:var(--pop-green)">Optimal</td><td>Continue scheduled protocol monitoring.</td></tr>
          <tr><td style="color:var(--pop-orange)">Warning</td><td>Repeat in ~4 weeks. Review donor chimerism.</td></tr>
          <tr><td style="color:var(--pop-red)">MRD Relapse</td><td>Confirm &lt;4 wks. Evaluate DLI / targeted intervention.</td></tr>
        </table>
      </div>
    </details>

    <button class="btn-option" style="justify-content:center; background:var(--pop-yellow); margin-top:12px;" onclick="restart()">
      <span class="option-title">↺ Start Next Patient</span>
    </button>
  `;
}
